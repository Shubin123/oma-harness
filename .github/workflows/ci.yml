name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        working-directory: oma-pkg
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: oma-pkg
        run: ruff check src/ tests/
      - name: Type check
        working-directory: oma-pkg
        run: mypy src/oma/ --ignore-missing-imports
      - name: Test
        working-directory: oma-pkg
        run: pytest tests/ -v --tb=short -m "not live"

  test-typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install deps
        working-directory: oma-ts
        run: npm install
      - name: Compile
        working-directory: oma-ts
        run: npx tsc --noEmit
      - name: Bundle check
        working-directory: oma-ts
        run: |
          npx esbuild src/cli.ts \
            --bundle --platform=node --target=node20 --format=esm \
            --outfile=dist/oma-bundle.mjs \
            --banner:js="import{createRequire}from'module';const require=createRequire(import.meta.url);"
          echo "Bundle size: $(wc -c < dist/oma-bundle.mjs) bytes"
