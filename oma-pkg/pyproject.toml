[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oma-harness"
version = "0.1.0"
description = "Open Multi Agent - a harness for running tasks across multiple LLM subscriptions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "shuba" },
]
keywords = ["llm", "multi-agent", "automation", "ai", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
web = []
all = ["pywebview>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
oma = "oma.cli:main"

[project.gui-scripts]
oma-gui = "oma.gui.app:main"

[project.urls]
Homepage = "https://github.com/shuba/oma-harness"
Repository = "https://github.com/shuba/oma-harness"
Issues = "https://github.com/shuba/oma-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/oma"]

# Without a VCS to filter by, hatchling defaults to "everything not excluded",
# which sweeps build/, dist/ and the 8 MB frozen binary into the sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src/oma",
    "/tests",
    "/README.md",
    "/SPEC.md",
    "/LICENSE",
    "/oma.spec",
    "/build_macos.sh",
]
exclude = [
    "**/__pycache__",
    "**/*.py[co]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for individual components (fast, no external dependencies)",
    "functional: Functional tests for component workflows and feature interactions",
    "smoke: Smoke tests for quick health and sanity checks",
    "e2e: End-to-end tests for full pipeline execution",
    "live: Live tests hitting real provider endpoints",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
